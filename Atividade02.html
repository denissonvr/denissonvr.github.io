
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cálculo do IMC</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #ffffff;
        text-align: center;
    }

    h1 {
        color: #3b72c4;
        font-size: 40px;
        margin-top: 40px;
    }

    .container {
        width: 700px;
        border: 2px solid #b3c5e0;
        padding: 25px;
        margin: 30px auto;
        text-align: left;
    }

    label {
        display: inline-block;
        width: 60px;
        font-weight: bold;
    }

    input {
        width: 200px;
        padding: 5px;
        margin: 5px 0;
    }

    #resultado {
        width: 250px;
        height: 120px;
        border: 2px solid #c0c0c0;
        display: inline-block;
        vertical-align: top;
        margin-left: 40px;
        padding: 10px;
        font-size: 18px;
    }

    button {
        margin-top: 10px;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>Cálculo do IMC</h1>

<div class="container">

    <div style="display: inline-block;">
        <label>Nome:</label>
        <input type="text" id="nome"><br>

        <label>Peso:</label>
        <input type="number" id="peso"><br>

        <label>Altura:</label>
        <input type="text" id="altura"><br>

        <button onclick="calcularIMC()">Calcular IMC</button>
    </div>

    <div id="resultado"></div>

</div>

<script>
function calcularIMC() {
    const nome = document.getElementById("nome").value;
    const peso = parseFloat(document.getElementById("peso").value);
    const altura = parseFloat(document.getElementById("altura").value.replace(",", "."));

    if (!nome || !peso || !altura) {
        document.getElementById("resultado").innerHTML = "Preencha todos os campos!";
        return;
    }

    const imc = peso / (altura * altura);

    document.getElementById("resultado").innerHTML =
        `Olá, ${nome}.<br>O seu IMC é de<br><b>${imc.toFixed(2)}</b>`;
}
</script>

</body>
</html>
